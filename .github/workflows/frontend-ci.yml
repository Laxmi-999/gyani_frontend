name: Frontend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup pnpm CLI
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 3. Setup Node.js 22 LTS
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Get pnpm store directory for caching
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 5. Cache pnpm dependencies cleanly
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 6. Install dependencies using pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      # 6.5 Run type check and linting

      - name: Run Typescript Check
        run: pnpm exec  tsc --noEmit

      - name: Run ESLint
        run:  pnpm run lint

      # 7. Build Next.js application
      - name: Build Application
        run: pnpm run build